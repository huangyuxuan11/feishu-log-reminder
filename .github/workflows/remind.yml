name: 客户经理日志未填提醒

on:
  workflow_dispatch:
  # GitHub 自带定时器（北京时间=UTC+8）：20:00/20:30/20:45
  # 与飞书多维表格自动化（同一时间档位）双保险；两路通过飞书去重控制表互斥，不会重复发消息。
  schedule:
    - cron: "0,30,45 12 * * 1-5"

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 运行未填提醒
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_USER_OPEN_ID: ${{ secrets.FEISHU_USER_OPEN_ID }}
          FEISHU_USER_ID: ${{ secrets.FEISHU_USER_ID }}
        run: python check_unfilled.py
