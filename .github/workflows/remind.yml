name: 客户经理日志未填提醒

on:
  # 注意：GitHub 自带 schedule 定时器在本仓库始终不触发（实测 23 次运行 0 次 schedule），
  # 故改用外部定时器（cron-job.org 等）定时调用 workflow_dispatch 接口来驱动，见说明。
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 运行未填提醒
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_USER_OPEN_ID: ${{ secrets.FEISHU_USER_OPEN_ID }}
          FEISHU_USER_ID: ${{ secrets.FEISHU_USER_ID }}
        run: python check_unfilled.py
