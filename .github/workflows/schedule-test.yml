name: 定时触发测试

on:
  schedule:
    # 北京时间（UTC+8）今天白天的几个测试点，用于验证定时触发器是否已生效
    - cron: "0 2 * * 1-5"    # 10:00 BJT
    - cron: "0 3 * * 1-5"    # 11:00 BJT
    - cron: "0 5 * * 1-5"    # 13:00 BJT
    - cron: "0 6 * * 1-5"    # 14:00 BJT
    - cron: "0 7 * * 1-5"    # 15:00 BJT
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 记录触发时间
        run: |
          echo "✅ scheduled-fired"
          echo "UTC : $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "BJT : $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
