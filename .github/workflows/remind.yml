name: 客户经理日志未填提醒

on:
  schedule:
    # 北京时间 = UTC+8
    # —— 正式时段：20:00/20:30/20:45 BJT = 12:00/12:30/12:45 UTC ——
    - cron: "0 12 * * 1-5"
    - cron: "30 12 * * 1-5"
    - cron: "45 12 * * 1-5"
    # —— 白天测试时段（临时，验证定时器后删除）——
    - cron: "0 2 * * 1-5"    # 10:00 BJT 测试
    - cron: "0 5 * * 1-5"    # 13:00 BJT 测试
  workflow_dispatch: {}   # 允许在 GitHub 网页手动触发测试

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 检查未填并推送飞书
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_USER_OPEN_ID: ${{ secrets.FEISHU_USER_OPEN_ID }}
          FEISHU_USER_ID: ${{ secrets.FEISHU_USER_ID }}
        run: python check_unfilled.py

# 调度重新注册 2026-07-29（强制 GitHub 重新加载 schedule 触发器）
