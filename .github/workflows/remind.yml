name: 客户经理日志未填提醒

on:
  schedule:
    # 北京时间 = UTC+8：白天测试点 10:00/13:00 + 正式 20:00/20:30/20:45
    - cron: "0 2 * * 1-5"
    - cron: "0 5 * * 1-5"
    - cron: "0 12 * * 1-5"
    - cron: "30 12 * * 1-5"
    - cron: "45 12 * * 1-5"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 运行未填提醒
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_USER_OPEN_ID: ${{ secrets.FEISHU_USER_OPEN_ID }}
          FEISHU_USER_ID: ${{ secrets.FEISHU_USER_ID }}
        run: python check_unfilled.py
