name: 客户经理日志未填提醒

on:
  schedule:
    # 北京时间 = UTC+8，故 20:00/20:30/20:45 BJT = 12:00/12:30/12:45 UTC
    # 仅工作日 周一~周五
    - cron: "0 12 * * 1-5"
    - cron: "30 12 * * 1-5"
    - cron: "45 12 * * 1-5"
  workflow_dispatch: {}   # 允许在 GitHub 网页手动触发测试

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 检查未填并推送飞书
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_USER_OPEN_ID: ${{ secrets.FEISHU_USER_OPEN_ID }}
          FEISHU_USER_ID: ${{ secrets.FEISHU_USER_ID }}
        run: python check_unfilled.py
