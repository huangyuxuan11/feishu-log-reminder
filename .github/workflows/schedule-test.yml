name: 定时触发测试

on:
  schedule:
    # 北京时间（UTC+8）今天白天的几个测试点，验证定时触发器是否已生效，并向本人飞书发私信
    - cron: "0 2 * * 1-5"    # 10:00 BJT
    - cron: "0 3 * * 1-5"    # 11:00 BJT
    - cron: "0 5 * * 1-5"    # 13:00 BJT
    - cron: "0 6 * * 1-5"    # 14:00 BJT
    - cron: "0 7 * * 1-5"    # 15:00 BJT
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 发送飞书测试私信
        run: python send_ping.py
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_USER_OPEN_ID: ${{ secrets.FEISHU_USER_OPEN_ID }}
